server:
  port: 0

spring:
  application:
    name: product-service
  #banner:
    #location: BANNER_LOCATION.txt
  ## No mostrar banner
  main:
    banner-mode: off
  ## MongoDB Connection
  mongodb:
    uri: mongodb://admin:200548@localhost:27017/techie_products?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

logging:
  pattern:
    dateformat: hh:mm
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE