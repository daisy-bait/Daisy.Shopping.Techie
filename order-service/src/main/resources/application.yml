server:
  port: 0

spring:
  application:
    name: order-service
  banner:
    location: BANNER_LOCATION.txt
    # No mostrar banner
    #main:
    #banner-mode: off
  ## MySQL BBDD Connection
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/MSVC_Techie_Shop_Orders?useSSL=false&serverTimeZone=UTC&allPublicKeyRetrival=true
    username: root
    password: 200548
  jpa:
    properties:
      hibernate:
        # Mostrar Mensajes SQL en Consola
        format_sql: true
    hibernate:
      ddl-auto: create-drop
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

# Actuator Properties
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true #Required for Eureka

# Resilience4J Properties
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        event-consumer-buffer-size: 10
        sliding-window-type: count_based
        sliding-window-size: 5
        failure-rate-threshold: 80
        wait-duration-in-open-state.seconds: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      inventory:
        base-config: default

  timelimiter:
    instances:
      inventory:
        timeout-duration.seconds: 3
# Resilience4j Time Limiter

logging:
  pattern:
    dateformat: hh:mm
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    org.springframework.cloud.loadbalancer: DEBUG
